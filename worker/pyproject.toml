[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-control-worker"
version = "0.1.0"
description = "Worker skeleton for the ecommerce AI control center"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
control-center-worker = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
