[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-control-worker"
dynamic = ["version"]
description = "Worker skeleton for the ecommerce AI control center"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "Pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "pystray>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<9",
]

[tool.setuptools.dynamic]
version = {attr = "app.version.WORKER_VERSION"}

[project.scripts]
control-center-worker = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
