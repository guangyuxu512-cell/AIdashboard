name: Production Deploy

# Production CD is normally initiated by local Codex over SSH. This reviewed,
# manual emergency entry uses exactly the same SHA/CI guard and remote lock.
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full published origin/main commit SHA to deploy
        required: true
        type: string
      backup_reference:
        description: Release Gate record with verified backup path, size, SHA-256 and readability
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: control-center-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Emergency deployment of a CI-verified main commit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure deployment SSH
        env:
          PRODUCTION_DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          PRODUCTION_DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          PRODUCTION_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${PRODUCTION_DEPLOY_HOST}"
          test -n "${PRODUCTION_DEPLOY_USER}"
          test -n "${PRODUCTION_DEPLOY_SSH_PRIVATE_KEY}"
          test -n "${PRODUCTION_SSH_KNOWN_HOSTS}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${PRODUCTION_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${PRODUCTION_DEPLOY_SSH_PRIVATE_KEY}"
          printf 'SSH_AUTH_SOCK=%s\n' "${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          printf 'SSH_AGENT_PID=%s\n' "${SSH_AGENT_PID}" >> "${GITHUB_ENV}"
      - name: Deploy with the shared local SSH entry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          PRODUCTION_DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          PRODUCTION_DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        run: |
          ./scripts/deploy-production.ps1 -DeploySha $env:DEPLOY_SHA `
            -SshHost "$($env:PRODUCTION_DEPLOY_USER)@$($env:PRODUCTION_DEPLOY_HOST)" `
            -PublicHost $env:PRODUCTION_DEPLOY_HOST -Mode Deploy `
            -BackupReference $env:BACKUP_REFERENCE
