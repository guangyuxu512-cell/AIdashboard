name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: control_center_ci
          POSTGRES_USER: control_center_ci
          POSTGRES_PASSWORD: control_center_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_center_ci -d control_center_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Migrate disposable CI database and run backend tests
        working-directory: backend
        run: |
          export BACKEND_DATABASE_URL='postgresql+psycopg://control_center_ci:control_center_ci@127.0.0.1:5432/control_center_ci'
          export BACKEND_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -m alembic upgrade head
          python -m pytest -q

  frontend-real-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build frontend in Real mode
        run: pnpm --filter @control-center/frontend build

  container-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate remote production deployment script syntax
        run: |
          bash -n scripts/production-env.sh
          bash -n scripts/resolve-production-deploy-target.sh
          bash -n scripts/remote-deploy-production.sh
          bash -n scripts/remote-provision-production-ip-tls.sh
          bash -n deploy/production/acme-auth-hook.sh
          bash -n deploy/production/acme-cleanup-hook.sh
          bash -n deploy/production/renew-production-ip-certificate.sh
      - name: Test production release cleanup ownership
        run: bash scripts/test-remote-deploy-production.sh
      - name: Test production deployment target resolution
        run: bash scripts/test-resolve-production-deploy-target.sh
      - name: Test production deployment workflow trigger contract
        run: bash scripts/test-production-deploy-workflow.sh
      - name: Build production backend image
        run: docker build --tag control-center-backend-ci:${{ github.sha }} backend
      - name: Verify PDD Node runtime and verified source
        run: |
          docker run --rm --entrypoint sh control-center-backend-ci:${{ github.sha }} -c \
            'node --version && test -f /app/app/platforms/pdd/vendor/anti_content.js && python -c "from app.platforms.pdd.signer import PddAntiContentSigner; PddAntiContentSigner().generate()"'
      - name: Build production frontend image
        run: docker build --tag control-center-frontend-ci:${{ github.sha }} --file frontend/Dockerfile .
      - name: Verify production frontend starts with a read-only root filesystem
        run: |
          container_name="control-center-frontend-ci-${{ github.run_id }}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "${container_name}" --network host --read-only \
            --tmpfs /etc/nginx/conf.d:size=1m,mode=0755 \
            --tmpfs /var/cache/nginx:size=16m,mode=1777 \
            --tmpfs /var/run:size=1m,mode=1777 \
            --tmpfs /tmp:size=16m,mode=1777 \
            --env FRONTEND_BIND_HOST=127.0.0.1 \
            --env FRONTEND_BIND_PORT=18080 \
            --env BACKEND_BIND_PORT=18001 \
            --env 'NGINX_ENVSUBST_FILTER=^(FRONTEND_BIND_HOST|FRONTEND_BIND_PORT|BACKEND_BIND_PORT)$' \
            control-center-frontend-ci:${{ github.sha }} >/dev/null
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_name}" >&2
          exit 1
      - name: Validate packaged release frontend build context
        run: |
          archive_path="${RUNNER_TEMP}/control-center-release-context.tar.gz"
          release_dir="${RUNNER_TEMP}/control-center-release-context"
          tar --exclude-vcs --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.env.*' \
            -czf "${archive_path}" \
            .dockerignore \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            electron/package.json mobile/package.json \
            backend frontend deploy/production \
            scripts/production-env.sh scripts/remote-deploy-production.sh
          mkdir -p "${release_dir}"
          tar -xzf "${archive_path}" -C "${release_dir}"
          test -f "${release_dir}/package.json"
          test -f "${release_dir}/pnpm-lock.yaml"
          test -f "${release_dir}/pnpm-workspace.yaml"
          test -f "${release_dir}/electron/package.json"
          test -f "${release_dir}/mobile/package.json"
          test -f "${release_dir}/scripts/production-env.sh"
          docker build --tag control-center-release-frontend-ci:${{ github.sha }} --file "${release_dir}/frontend/Dockerfile" "${release_dir}"
      - name: Validate production compose contract
        run: |
          DEPLOYMENT_IMAGE_TAG=${{ github.sha }} \
          BACKEND_DATABASE_URL=postgresql+psycopg://placeholder:placeholder@127.0.0.1:35433/control_center_prod \
          BACKEND_ENCRYPTION_KEY=placeholder \
          BACKEND_DOUYIN_SIGNER_API_KEY=placeholder \
          BACKEND_TOAPIS_API_KEY=placeholder \
          BACKEND_DOUYIN_SIGNER_URL=http://127.0.0.1:8788 \
          BACKEND_HUMAN_SESSION_COOKIE_SECURE=true \
          PRODUCTION_DOMAIN=example.invalid \
          PRODUCTION_TLS_CERTIFICATE_PATH=/tmp/fullchain.pem \
          PRODUCTION_TLS_CERTIFICATE_KEY_PATH=/tmp/privkey.pem \
          PRODUCTION_NGINX_VHOST_DIR=/tmp \
          PRODUCTION_ENV_FILE="$(pwd)/deploy/production/.env.example" \
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config -q
