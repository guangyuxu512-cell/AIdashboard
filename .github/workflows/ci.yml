name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: control_center_ci
          POSTGRES_USER: control_center_ci
          POSTGRES_PASSWORD: control_center_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_center_ci -d control_center_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Migrate disposable CI database and run backend tests
        working-directory: backend
        run: |
          export BACKEND_DATABASE_URL='postgresql+psycopg://control_center_ci:control_center_ci@127.0.0.1:5432/control_center_ci'
          export BACKEND_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -m alembic upgrade head
          python -m pytest -q

  frontend-real-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build frontend in Real mode
        run: pnpm --filter @control-center/frontend build
      - name: Verify AI images and team context in the Real production bundle
        run: |
          pnpm --filter @control-center/frontend exec playwright install --with-deps chromium
          pnpm --filter @control-center/frontend exec playwright test --config playwright.ai-images.config.ts
      - name: Validate and build Mobile production output
        run: |
          pnpm --filter @control-center/mobile lint
          pnpm --filter @control-center/mobile test
          pnpm --filter @control-center/mobile build

  verify-offline:
    # Worker has three Windows-only unit cases; do not hide them as Linux skips.
    # The original Linux/PostgreSQL/container jobs below and above stay intact.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install existing verification dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e './backend[dev]'
          python -m venv "${RUNNER_TEMP}/verify-worker"
          "${RUNNER_TEMP}/verify-worker/Scripts/python.exe" -m pip install -e './worker[dev]'
      - name: Verify contracts and the full offline profile
        env:
          VERIFY_WORKER_PYTHON: ${{ runner.temp }}/verify-worker/Scripts/python.exe
        run: pnpm verify --full --report=.dev-runtime/verify/ci.json
      - name: Upload scoped verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-offline-report
          path: .dev-runtime/verify/ci.json
          if-no-files-found: error

  container-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate remote production deployment script syntax
        run: |
          bash -n scripts/production-env.sh
          bash -n scripts/remote-deploy-production.sh
          bash -n scripts/remote-provision-production-ip-tls.sh
          bash -n deploy/production/acme-auth-hook.sh
          bash -n deploy/production/acme-cleanup-hook.sh
          bash -n deploy/production/renew-production-ip-certificate.sh
      - name: Test production release cleanup ownership
        run: bash scripts/test-remote-deploy-production.sh
      - name: Test PC static asset retention
        run: bash scripts/test-pc-static-assets.sh
      - name: Test local and emergency production deployment entry
        run: pwsh -NoProfile -File scripts/test-deploy-production.ps1
      - name: Test production deployment workflow trigger contract
        run: bash scripts/test-production-deploy-workflow.sh
      - name: Build production backend image
        run: bash scripts/test-backend-dependency-cache.sh control-center-backend-ci:${{ github.sha }}
      - name: Verify PDD Node runtime and verified source
        run: |
          docker run --rm --entrypoint sh control-center-backend-ci:${{ github.sha }} -c \
            'node --version && test -f /app/app/platforms/pdd/vendor/anti_content.js && python -c "from app.platforms.pdd.signer import PddAntiContentSigner; PddAntiContentSigner().generate()"'
      - name: Build production frontend image
        run: docker build --tag control-center-frontend-ci:${{ github.sha }} --file frontend/Dockerfile .
      - name: Verify asset upload transport through production Nginx proxies
        timeout-minutes: 5
        run: bash scripts/test-asset-upload-proxy.sh control-center-frontend-ci:${{ github.sha }} control-center-backend-ci:${{ github.sha }}
      - name: Verify retained PC assets with production Nginx
        run: bash scripts/test-pc-static-nginx.sh control-center-frontend-ci:${{ github.sha }}
      - name: Verify PC and Mobile production entries with a read-only root filesystem
        run: |
          container_name="control-center-frontend-ci-${{ github.run_id }}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "${container_name}" --network host --read-only \
            --tmpfs /etc/nginx/conf.d:size=1m,mode=0755 \
            --tmpfs /var/cache/nginx:size=16m,mode=1777 \
            --tmpfs /var/run:size=1m,mode=1777 \
            --tmpfs /tmp:size=16m,mode=1777 \
            --env FRONTEND_BIND_HOST=127.0.0.1 \
            --env FRONTEND_BIND_PORT=18080 \
            --env BACKEND_BIND_PORT=18001 \
            --env 'NGINX_ENVSUBST_FILTER=^(FRONTEND_BIND_HOST|FRONTEND_BIND_PORT|BACKEND_BIND_PORT)$' \
            control-center-frontend-ci:${{ github.sha }} >/dev/null
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              frontend_ready=true
              break
            fi
            sleep 1
          done
          if [ "${frontend_ready:-false}" != 'true' ]; then
            docker logs "${container_name}" >&2
            exit 1
          fi

          pc_document="$(curl --fail --silent --show-error http://127.0.0.1:18080/)"
          mobile_document="$(curl --fail --silent --show-error http://127.0.0.1:18080/mobile/)"
          mobile_deep_document="$(curl --fail --silent --show-error http://127.0.0.1:18080/mobile/deep-link)"
          test "${pc_document}" != "${mobile_document}"
          test "${mobile_document}" = "${mobile_deep_document}"
          printf '%s' "${mobile_document}" | grep -Fq '/mobile/manifest.webmanifest'
          printf '%s' "${mobile_document}" | grep -Eq '/mobile/assets/[^" ]+\.js'
          printf '%s' "${mobile_document}" | grep -Eq '/mobile/assets/[^" ]+\.css'

          mobile_redirect_headers="$(
            curl --fail --silent --show-error --head \
              --header 'Host: 119.29.188.118' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18080/mobile | tr -d '\r'
          )"
          printf '%s\n' "${mobile_redirect_headers}" | grep -Fq 'HTTP/1.1 308'
          printf '%s\n' "${mobile_redirect_headers}" | grep -Eqi '^Location: /mobile/$'
          curl --fail --silent --show-error http://127.0.0.1:18080/mobile/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/mobile/icons/icon-192.png >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/mobile/icons/icon-512.png >/dev/null

          mapfile -t mobile_assets < <(printf '%s' "${mobile_document}" | grep -Eo '/mobile/assets/[^" ]+\.(css|js)' | sort -u)
          test "${#mobile_assets[@]}" -ge 2
          for asset_path in "${mobile_assets[@]}"; do
            curl --fail --silent --show-error "http://127.0.0.1:18080${asset_path}" >/dev/null
          done

          curl --silent --head http://127.0.0.1:18080/mobile/ | tr -d '\r' | grep -Fqi 'Cache-Control: no-store, no-cache, must-revalidate'
          curl --silent --head http://127.0.0.1:18080/mobile/manifest.webmanifest | tr -d '\r' | grep -Fqi 'Content-Type: application/manifest+json'
          curl --silent --head "http://127.0.0.1:18080${mobile_assets[0]}" | tr -d '\r' | grep -Fqi 'Cache-Control: public, max-age=31536000, immutable'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/mobile/assets/missing.js)" = '404'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/mobile/icons/missing.png)" = '404'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/health)" = '502'
      - name: Validate packaged release frontend build context
        run: |
          archive_path="${RUNNER_TEMP}/control-center-release-context.tar.gz"
          release_dir="${RUNNER_TEMP}/control-center-release-context"
          tar --exclude-vcs --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.env.*' \
            -czf "${archive_path}" \
            .dockerignore \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            electron/package.json \
            backend frontend mobile deploy/production \
            scripts/production-env.sh scripts/remote-deploy-production.sh
          mkdir -p "${release_dir}"
          tar -xzf "${archive_path}" -C "${release_dir}"
          test -f "${release_dir}/package.json"
          test -f "${release_dir}/pnpm-lock.yaml"
          test -f "${release_dir}/pnpm-workspace.yaml"
          test -f "${release_dir}/electron/package.json"
          test -f "${release_dir}/mobile/package.json"
          test -f "${release_dir}/mobile/index.html"
          test -f "${release_dir}/mobile/vite.config.ts"
          test -f "${release_dir}/mobile/src/main.ts"
          test -f "${release_dir}/mobile/public/manifest.webmanifest"
          test -f "${release_dir}/mobile/public/icons/icon-192.png"
          test -f "${release_dir}/mobile/public/icons/icon-512.png"
          test -f "${release_dir}/scripts/production-env.sh"
          test -f "${release_dir}/deploy/production/pc-static-assets.sh"
          bash -n "${release_dir}/deploy/production/pc-static-assets.sh"
          docker build --tag control-center-release-frontend-ci:${{ github.sha }} --file "${release_dir}/frontend/Dockerfile" "${release_dir}"
      - name: Validate production compose contract
        run: |
          DEPLOYMENT_IMAGE_TAG=${{ github.sha }} \
          BACKEND_DATABASE_URL=postgresql+psycopg://placeholder:placeholder@127.0.0.1:35433/control_center_prod \
          BACKEND_ENCRYPTION_KEY=placeholder \
          BACKEND_DOUYIN_SIGNER_API_KEY=placeholder \
          BACKEND_TOAPIS_API_KEY=placeholder \
          BACKEND_DOUYIN_SIGNER_URL=http://127.0.0.1:8788 \
          BACKEND_HUMAN_SESSION_COOKIE_SECURE=true \
          PRODUCTION_DOMAIN=example.invalid \
          PRODUCTION_TLS_CERTIFICATE_PATH=/tmp/fullchain.pem \
          PRODUCTION_TLS_CERTIFICATE_KEY_PATH=/tmp/privkey.pem \
          PRODUCTION_NGINX_VHOST_DIR=/tmp \
          PRODUCTION_ENV_FILE="$(pwd)/deploy/production/.env.example" \
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config -q
      - name: Validate isolated application Session grant mount
        run: |
          export DEPLOYMENT_IMAGE_TAG='${{ github.sha }}'
          export PRODUCTION_ENV_FILE="$(pwd)/deploy/production/.env.example"
          grant_dir="${RUNNER_TEMP}/application-session-grants"
          mkdir -p "$grant_dir"
          chmod 755 "$grant_dir"
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --format json > "$RUNNER_TEMP/session-default.json"
          APPLICATION_SHOP_SESSION_CONFIG_SOURCE="$grant_dir" docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --format json > "$RUNNER_TEMP/session-bind.json"
          python - "$RUNNER_TEMP/session-default.json" "$RUNNER_TEMP/session-bind.json" "$grant_dir" <<'PY'
          import json, pathlib, sys
          default, bound = (json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:3])
          target = '/run/secrets/application-sessions'
          def mount(config):
              matches = [m for m in config['services']['backend']['volumes'] if m['target'] == target]
              assert len(matches) == 1 and matches[0]['read_only'] is True
              return matches[0]
          assert mount(default)['type'] == 'volume'
          assert mount(bound)['type'] == 'bind' and mount(bound)['source'] == sys.argv[3]
          assert all(not any(m['target'] == target for m in service.get('volumes', []))
                     for name, service in bound['services'].items() if name != 'backend')
          PY
          printf 'before' > "$grant_dir/clients.json"
          chmod 644 "$grant_dir/clients.json"
          name="control-center-app-session-mount-${{ github.run_id }}"
          cleanup() { docker rm --force "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" --network none --read-only \
            --mount "type=bind,src=$grant_dir,dst=/run/secrets/application-sessions,readonly" \
            --entrypoint python "control-center-backend-ci:${{ github.sha }}" -c 'import time; time.sleep(60)' >/dev/null
          docker exec "$name" python -c "from pathlib import Path; assert Path('/run/secrets/application-sessions/clients.json').read_text() == 'before'"
          printf 'after' > "$grant_dir/clients.next"
          chmod 644 "$grant_dir/clients.next"
          mv -f "$grant_dir/clients.next" "$grant_dir/clients.json"
          docker exec "$name" python -c "from pathlib import Path; assert Path('/run/secrets/application-sessions/clients.json').read_text() == 'after'"
