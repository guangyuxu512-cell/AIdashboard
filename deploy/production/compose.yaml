name: control-center-production

services:
  douyin-signer:
    image: ecommerce-control-center-douyin-signer-prod:${DEPLOYMENT_IMAGE_TAG:?DEPLOYMENT_IMAGE_TAG is required}
    build:
      context: ../../backend/douyin-signer
      dockerfile: Dockerfile
    container_name: control-center-douyin-signer-prod
    env_file:
      - ${PRODUCTION_ENV_FILE:?PRODUCTION_ENV_FILE is required}
    environment:
      PORT: ${DOUYIN_SIGNER_BIND_PORT:-8788}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    image: ecommerce-control-center-backend-prod:${DEPLOYMENT_IMAGE_TAG:?DEPLOYMENT_IMAGE_TAG is required}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: control-center-backend-prod
    env_file:
      - ${PRODUCTION_ENV_FILE:?PRODUCTION_ENV_FILE is required}
    environment:
      UVICORN_HOST: ${BACKEND_BIND_HOST:-127.0.0.1}
      UVICORN_PORT: ${BACKEND_BIND_PORT:-18001}
      BACKEND_ASSET_STORAGE_DIR: /app/data/assets
    depends_on:
      douyin-signer:
        condition: service_healthy
    volumes:
      - backend-assets:/app/data/assets
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    image: ecommerce-control-center-frontend-prod:${DEPLOYMENT_IMAGE_TAG:?DEPLOYMENT_IMAGE_TAG is required}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_MODE: real
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    container_name: control-center-frontend-prod
    environment:
      FRONTEND_BIND_HOST: ${FRONTEND_BIND_HOST:-127.0.0.1}
      FRONTEND_BIND_PORT: ${FRONTEND_BIND_PORT:-18080}
      BACKEND_BIND_PORT: ${BACKEND_BIND_PORT:-18001}
      NGINX_ENVSUBST_FILTER: '^(FRONTEND_BIND_HOST|FRONTEND_BIND_PORT|BACKEND_BIND_PORT)$'
    depends_on:
      backend:
        condition: service_healthy
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  backend-assets:
    name: control-center-backend-prod-assets
