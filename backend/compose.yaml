name: control-center-backend-dev

services:
  douyin-signer:
    image: ecommerce-control-center-douyin-signer-dev:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./douyin-signer
      dockerfile: Dockerfile
    container_name: control-center-douyin-signer-dev
    env_file:
      - ../../.env
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    image: ecommerce-control-center-backend-dev:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control-center-backend-dev
    env_file:
      - ../../.env
    environment:
      UVICORN_HOST: ${BACKEND_BIND_HOST:-127.0.0.1}
      UVICORN_PORT: ${BACKEND_BIND_PORT:-18000}
      BACKEND_ASSET_STORAGE_DIR: /app/data/assets
    depends_on:
      douyin-signer:
        condition: service_healthy
    volumes:
      - backend-assets:/app/data/assets
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  backend-assets:
